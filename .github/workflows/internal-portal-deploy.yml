name: Internal Portal Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'internal-portal/**'
      - 'common/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './internal-portal/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: './internal-portal'

      - name: Build with Vite
        env:
          VITE_COGNITO_AUTHORITY: ${{ vars.INTERNAL_PORTAL_COGNITO_AUTHORITY }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.INTERNAL_PORTAL_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.INTERNAL_PORTAL_COGNITO_DOMAIN }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.INTERNAL_PORTAL_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_POST_LOGOUT_REDIRECT_URI: ${{ vars.INTERNAL_PORTAL_COGNITO_POST_LOGOUT_REDIRECT_URI }}
          VITE_API_URL: ${{ vars.INTERNAL_PORTAL_API_URL }}
        run: pnpm run build
        working-directory: './internal-portal'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://project-faultline-internal-portal \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://project-faultline-internal-portal/index.html \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html"
        working-directory: './internal-portal'
